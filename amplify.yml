version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use || nvm install
        - node --version
        - npm --version
        - npm ci
    build:
      commands:
        - npm run typecheck
        - npm run lint
        - npm test -- --runInBand
        - npm audit --omit=dev --audit-level=high
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
